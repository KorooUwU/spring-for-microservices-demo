# Centralized configuration for API Gateway
spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      server:
        webflux:
          routes:
            - id: products
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/products
              filters:
                - StripPrefix=1
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/v3/api-docs/product-service
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Product Service
        url: /v3/api-docs/product-service
      - name: 2. Order Service
        url: /v3/api-docs/order-service
