name: spring-shop-demo
services:
  config-server:
    build: ./config-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8888/product-service/default"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["8888:8888"]
    environment:
      CONFIG_DIR: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    restart: unless-stopped
  eureka-server:
    build: ./eureka-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["8761:8761"]
    restart: unless-stopped
  product-service:
    build: ./product-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["8081:8081"]
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    restart: unless-stopped
  order-service:
    build: ./order-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["8082:8082"]
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    restart: unless-stopped
  api-gateway:
    build: ./api-gateway
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports: ["8080:8080"]
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    restart: unless-stopped
